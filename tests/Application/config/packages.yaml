framework:
    secret: 'test-secret'
    test: true
    session:
        storage_factory_id: session.storage.factory.mock_file
    router:
        utf8: true
    csrf_protection: true
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true
    validation:
        email_validation_mode: html5
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: ['fr']
    default_locale: fr
    enabled_locales: ['fr', 'en']
    set_locale_from_accept_language: true
    property_info:
        with_constructor_extractor: true
    asset_mapper:
        paths: ['assets/']
        importmap_path: '%kernel.project_dir%/config/importmap.php'
    rate_limiter:
        gingerminds_core_api:
            storage_service: test.rate_limiter_storage
        gingerminds_media_manager_files:
            storage_service: test.rate_limiter_storage

doctrine:
    dbal:
        url: 'sqlite:///%kernel.cache_dir%/test.db'
    orm:
        enable_native_lazy_objects: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            TestApplication:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/Entity'
                prefix: 'Gingerminds\MediaManagerBundle\Tests\Application\Entity'

twig:
    default_path: '%kernel.project_dir%/templates'

api_platform:
    title: 'Gingerminds media manager test API'
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    patch_formats:
        json: ['application/merge-patch+json', 'application/json']
    defaults:
        stateless: true
        pagination_client_items_per_page: true

security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto
            cost: 4
            time_cost: 3
            memory_cost: 10
    providers:
        gingerminds_users:
            id: gingerminds_core.security.user_provider
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|assets)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: gingerminds_users
            access_token:
                token_handler: gingerminds_core.security.api_token_handler
                failure_handler: gingerminds_core.security.api_failure_handler
        admin:
            lazy: true
            provider: gingerminds_users
            form_login:
                login_path: gingerminds_core_login
                check_path: gingerminds_core_login
                default_target_path: gingerminds_core_dashboard
                enable_csrf: true
            logout:
                path: gingerminds_core_logout
                target: gingerminds_core_login
    access_control:
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: IS_AUTHENTICATED }

parameters:
    env(FILE_LIBRARY_DISK): 'default'
    env(FILE_LIBRARY_ROOT): 'library'
    env(FILE_LIBRARY_MAX_UPLOAD_SIZE): '100'

# Env placeholders on purpose: they are resolved at runtime only.
gingerminds_core:
    resources:
        article:
            entity: Gingerminds\MediaManagerBundle\Tests\Application\Entity\Article
            controller: Gingerminds\MediaManagerBundle\Tests\Application\Controller\ArticleController

gingerminds_media_manager:
    storage:
        default_disk: '%env(FILE_LIBRARY_DISK)%'
    library:
        root: '%env(FILE_LIBRARY_ROOT)%'
        max_upload_size: '%env(int:FILE_LIBRARY_MAX_UPLOAD_SIZE)%'
        allowed_mimes: ['text/plain', 'image/png', 'image/svg+xml', 'application/zip', 'application/docx']
        max_directory_move: 3
    images:
        presets:
            thumbnail: { w: 50, h: 40, fit: crop }
            card: { w: 20, fm: png }
    files_rate_limit: 5

# In-memory files: nothing is written on disk by the tests.
flysystem:
    storages:
        gingerminds_media_manager.storage.default:
            memory: ~

# Bootstrap SCSS lives in the bundle vendor/.
symfonycasts_sass:
    sass_options:
        load_path: ['%kernel.project_dir%/../../vendor/twbs']

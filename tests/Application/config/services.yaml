services:
    _defaults:
        autowire: true
        autoconfigure: true

    test.rate_limiter_storage:
        class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

    # Keeps PHPUnit output clean.
    logger:
        class: Psr\Log\NullLogger

    # Bundle services fetched by the tests.
    test.file_storage:
        alias: gingerminds_media_manager.file.storage
        public: true
